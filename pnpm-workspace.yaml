packages:
  - .

# Supply-chain safety: only resolve newly selected package versions after they
# have been published for at least one week (value is minutes).
minimumReleaseAge: 10080

# Keep lifecycle scripts deny-by-default. Only native/tooling packages required
# by this project may build; known transitive scripts that are not needed by the
# gateway are explicitly ignored so installs stay non-interactive.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
ignoredBuiltDependencies:
  - '@google/genai'
  - koffi
  - protobufjs
allowBuilds:
  '@google/genai': false
  better-sqlite3: true
  esbuild: true
  koffi: false
  protobufjs: false
